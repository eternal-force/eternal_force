<div class="exercise-entry-row" data-collapsed="false">
  <div class="exercise-entry-header">
    <button type="button" class="exercise-row-toggle">
      <span class="exercise-toggle-arrow">▸</span>
      <span class="exercise-row-summary muted">尚未填寫</span>
    </button>
    <div class="exercise-entry-header-actions">
      <button type="button" class="btn btn-sm exercise-row-collapse">收合</button>
      <button type="button" class="btn btn-sm btn-danger exercise-row-remove">移除</button>
    </div>
  </div>
  <div class="exercise-entry-body">
    <div class="form-grid cols-2">
      <div>
        <span class="field-label-mobile">分類</span>
        <select name="exercise_category" class="exercise-category-select">
          <option value="">請選擇分類</option>
          {% for c in categories %}
            <option value="{{ c }}" {% if row.category == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <span class="field-label-mobile">訓練項目</span>
        <input
          type="text"
          name="exercise_name"
          value="{{ row.name }}"
          {% if row_index is not none %}list="exercise-name-options-{{ row_index }}"{% endif %}
          placeholder="選擇分類後可帶出項目，或輸入自訂項目"
          autocomplete="off"
        >
        <datalist {% if row_index is not none %}id="exercise-name-options-{{ row_index }}"{% endif %}>
          {% for n in catalog_map.get(row.category, []) %}
            <option value="{{ n }}">
          {% endfor %}
        </datalist>
      </div>
    </div>
    <div class="form-grid cols-3" style="margin-top:8px;">
      <div>
        <span class="field-label-mobile">公斤數</span>
        <input type="number" name="exercise_weight_kg" value="{{ row.weight_kg }}" min="0" step="0.5" placeholder="kg">
      </div>
      <div>
        <span class="field-label-mobile">組數</span>
        <input type="number" name="exercise_sets" value="{{ row.sets }}" min="0" step="1" placeholder="組">
      </div>
      <div>
        <span class="field-label-mobile">次數</span>
        <input type="number" name="exercise_reps" value="{{ row.reps }}" min="0" step="1" placeholder="次">
      </div>
    </div>
    <div style="margin-top:8px;">
      <span class="field-label-mobile">備註</span>
      <input type="text" name="exercise_note" value="{{ row.note }}" placeholder="這個項目的備註（選填）">
    </div>
  </div>
</div>
